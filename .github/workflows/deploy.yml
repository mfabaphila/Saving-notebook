        run: |
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$EC2_SSH_KEY" > "$HOME/.ssh/ec2_key"
          chmod 600 "$HOME/.ssh/ec2_key"
          ssh-keyscan -H "$EC2_HOST" >> "$HOME/.ssh/known_hosts"

          ssh -i "$HOME/.ssh/ec2_key" "$EC2_USER@$EC2_HOST" << 'EOF'
            set -e

            cd /home/ec2-user/Saving-notebook
            git pull origin main
            docker build -t saving-notebook .
            docker stop money-book || true
            docker rm money-book || true
            docker run -d --name money-book -p 8000:80 saving-notebook
          EOF