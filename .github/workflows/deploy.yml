name: Deploy Saving-notebook to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            git config --global --add safe.directory ~/Saving-notebook
            cd ~/Saving-notebook
            git fetch origin main
            git reset --hard origin/main
            docker build -t saving-notebook .
            docker stop money-book || true
            docker rm money-book || true
            docker run -d --name money-book -p 80:80 saving-notebook
